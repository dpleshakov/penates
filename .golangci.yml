version: "2"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # Imports from this module form their own group, after the third-party one.
      local-prefixes:
        - github.com/dpleshakov/penates

linters:
  default: standard
  enable:
    # The standard set, named explicitly so that the list is the whole truth.
    - errcheck
    - govet
    - staticcheck
    - unused
    # Style and correctness beyond the standard set.
    - revive
    - gosec
    - gocritic
    - misspell
    - whitespace
  settings:
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          # Exported identifiers need a doc comment; methods on unexported
          # receivers are held to the same standard, since they are the bulk
          # of this codebase.
          arguments:
            - checkPrivateReceivers
  exclusions:
    rules:
      # Tests deliberately use weak setups and blunt constructs that gosec and
      # gocritic flag in production code.
      - path: _test\.go
        linters:
          - gosec
          - gocritic

issues:
  # Every identical finding is a real one: the default cap of three per text
  # hid a third of the gosec and errcheck findings during the 2026-11-07 sweep.
  max-same-issues: 0
